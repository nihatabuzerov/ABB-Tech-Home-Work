databaseChangeLog:
  - changeSet:
      id: 002-create-exchange-rates-table
      author: Nihat Abuzerov
      changes:
        - createTable:
            tableName: exchange_rates
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: rate_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: currency_code
                  type: varchar(3)
                  constraints:
                    nullable: false
              - column:
                  name: nominal
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: rate_to_azn
                  type: decimal(18,6)
                  constraints:
                    nullable: false
              - column:
                  name: fetched_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: exchange_rates
            columnNames: rate_date, currency_code
            constraintName: uq_exchange_rates_date_currency

spring:


  datasource:
    url: jdbc:postgresql://localhost:5432/automotive_db
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
    hikari:
      minimum-idle: 2
      idle-timeout: 40000
      maximum-pool-size: 10
      connection-timeout: 10000
      keepalive-time: 30000
      schema: car_service

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: car_service
    open-in-view: false
    show-sql: true
  liquibase:
    enabled: true


course:
  name: ABB Tech Academy local
jwt:
    secret: MySuperSecretKeyMySuperSecretKey123456
    access-exp: 3600000        # 1 saat (ms)
    refresh-exp: 86400000
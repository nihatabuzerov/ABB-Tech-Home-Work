server:
  servlet:
    context-path: /api-car

spring:
  profiles:
    active: local   # MY_PROFILE_NAME yoxdursa, default "local" istifadə olunur

  datasource:
    url: jdbc:postgresql://${HOST}:${PORT:5432}/${DB_NAME}?currentSchema=${SCHEMA}
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
    hikari:
      schema: ${SCHEMA}
      minimum-idle: 2
      idle-timeout: 40000
      maximum-pool-size: 10
      connection-timeout: 10000
      keepalive-time: 30000
  jpa:
    properties:
      hibernate:
        default_schema: ${SCHEMA}
    hibernate:
      ddl-auto: validate   # create → validate, Liquibase ilə conflict verməsin
    open-in-view: false
    show-sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog.yaml

  threads:
    virtual:
      enabled: true
